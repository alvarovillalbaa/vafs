            const parent = realpathSync(process.env.RUNNER_TEMP), rg = resolveRg();
            task = mkdtempSync(join(parent, 'vafs-reader63-')); taskIdentity = lstatSync(task);
            fixtures = join(task, 'fixtures'); mkdirSync(fixtures, { mode: 0o700 });
            env = { PATH: [...new Set([dirname(process.execPath), dirname(rg), '/usr/bin', '/bin'])].join(':'), TMPDIR: fixtures, TZ: 'UTC' };
            runtime = { node: { command: 'node', version: process.version, sha256: await fileHash(realpathSync(process.execPath)) }, rg: { command: 'rg', version: execFileSync(rg, ['--version'], { env, encoding: 'utf8', timeout: 3000, maxBuffer: 8192 }).trim(), sha256: await fileHash(rg) }, platform: process.platform, arch: process.arch };
            before = sourceGuard(); await new Promise(resolve => setImmediate(resolve)); if (signals.length) fail('interrupted');
            await new Promise(resolve => {
