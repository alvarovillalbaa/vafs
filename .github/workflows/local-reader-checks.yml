name: Local reader 63 checks

on:
  push:
    branches: [main]
    paths: [.github/workflows/local-reader-checks.yml]

permissions:
  contents: read

jobs:
  reader:
    if: ${{ github.repository == 'alvarovillalbaa/vafs' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: d6888b7ab92cc17630858831879453402397b91e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Verify sealed source and run exactly 63 local reader checks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
