              monitor = setInterval(sample, 50); deadline = setTimeout(() => stop('deadline'), 120000);
              fallback = setTimeout(() => { stop('settlement_timeout'); child.stdout.destroy(); child.stderr.destroy(); resolve(); }, 125000);
              child.stdout.on('data', chunk => { const room = 262144 - outputBytes; output.push(chunk.subarray(0, Math.max(0, room))); outputBytes += chunk.length; if (outputBytes > 262144) stop('stdout_limit'); });
