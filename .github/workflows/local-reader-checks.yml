          const passed = problems.length === 0 && signals.length === 0 && stopped === null && childCode === 0 && childSignal === null && before && after && exactCases && utf8Exact && totalRows.length === 7 && new Set(totalRows.map(row => row[0])).size === 7 && Object.keys(expected).every(key => totals[key] === expected[key]) && JSON.stringify(plans) === '[63]' && cleanup.processesStopped && cleanup.ownedTmpRemoved && !cleanup.forced;
