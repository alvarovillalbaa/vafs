# TEMPORARY. Exact reviewed Q01 source; retire after the first keyword journey.
name: Temporary vAFS real QMD keyword checks 1
on:
  create:
permissions:
  contents: read
jobs:
  local-qmd-keyword:
    if: github.repository == 'alvarovillalbaa/vafs' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/vafs-qmd-keyword-20261107-1' && github.ref == 'refs/heads/qa/vafs-qmd-keyword-20261107-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      SOURCE_COMMIT: 0a84a57b23c5f642d738e956d09d5d31a8029bd9
      VAFS_QMD_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - name: Record earliest user-step clock for the total job budget
        run: echo "VAFS_QMD_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          clean: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install exact signed Ubuntu ripgrep package on disposable runner
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends --no-upgrade ripgrep=14.1.0-1
          test "$(dpkg-query -W -f='${Version}' ripgrep)" = '14.1.0-1'
      - name: Admit native SQLite vector bindings and check only Q01
        run: node tests/scripts/run-local-qmd-checks.mjs --source-commit "$SOURCE_COMMIT"
